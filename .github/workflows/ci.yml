name: CI

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]
  push:
    branches:
      - main
  # Ready for a merge queue: GitHub runs the same checks on the queued merge.
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The checks run as parallel jobs; `verify` at the end is the one branch
# protection requires, so the rule does not change when jobs are split or
# added. A pull request that only touches docs skips the heavy jobs.

env:
  AUTH_TOKEN: ci-auth-token
  CI: "true"
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/involute_test?schema=public
  VIEWER_ASSERTION_SECRET: ci-viewer-assertion-secret

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Research stays out of git and images (AGENTS.md §4.7)
        run: bash scripts/ci-research-guard.sh

      - name: Verify PR Work Graph Reference
        if: github.event_name == 'pull_request'
        run: bash scripts/ci-pr-lint.sh
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.head_ref }}

      - name: Detect docs-only changes
        id: diff
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")
          echo "$changed"
          # Anything outside docs, research notes, markdown and skills counts as code.
          if echo "$changed" | grep -qvE '^(docs/|research/|skills/)|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  typecheck:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22
      - run: pnpm install --frozen-lockfile
      # `pnpm lint` runs the same tsc commands in every package; one pass is enough.
      - name: Typecheck
        run: pnpm typecheck

  server-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: involute_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d involute_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Deploy test database migrations
        run: pnpm --filter @turnkeyai/involute-server prisma:migrate:deploy
      # Server tests share one database, so each shard gets its own Postgres.
      - name: Server tests (shard ${{ matrix.shard }}/3)
        run: pnpm --filter @turnkeyai/involute-server test --shard=${{ matrix.shard }}/3

  other-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: involute_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d involute_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Deploy test database migrations
        run: pnpm --filter @turnkeyai/involute-server prisma:migrate:deploy
      - name: Shared and CLI tests
        run: |
          pnpm --filter @turnkeyai/involute-shared test --run
          pnpm --filter @turnkeyai/involute test --run

  web-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22
      - run: pnpm install --frozen-lockfile
      # Same as `pnpm --filter @turnkeyai/involute-web test` (one vitest process
      # per file, which the suite relies on), with the files split into shards.
      - name: Web tests (shard ${{ matrix.shard }}/3)
        working-directory: packages/web
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          SHARD: ${{ matrix.shard }}
        run: |
          pnpm --filter @turnkeyai/involute-shared build
          files=$(find src -type f \( -name "*.test.ts" -o -name "*.test.tsx" \) | sort | awk -v k="$SHARD" 'NR % 3 == k % 3')
          for file in $files; do
            pnpm exec vitest --config vitest.config.ts --reporter=dot --passWithNoTests --run "$file" || exit 1
          done

  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      # The e2e servers run from source (tsx, vite) against their own compose
      # database; they need the shared package built and the Prisma client.
      - name: Build shared package and Prisma client
        run: |
          pnpm --filter @turnkeyai/involute-shared build
          pnpm --filter @turnkeyai/involute-server prisma:generate
      - name: End-to-end tests
        run: pnpm e2e

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Docker Compose build
        run: docker compose build

  verify:
    needs: [changes, typecheck, server-tests, other-tests, web-tests, e2e, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed or were skipped for a docs-only change
        run: |
          echo '${{ toJSON(needs) }}' | python3 -c "
          import json, sys
          needs = json.load(sys.stdin)
          bad = {name: job['result'] for name, job in needs.items() if job['result'] not in ('success', 'skipped')}
          if needs['changes']['result'] != 'success':
              bad['changes'] = needs['changes']['result']
          print(json.dumps({name: job['result'] for name, job in needs.items()}, indent=2))
          sys.exit(1 if bad else 0)
          "
