# Secret TEMPLATE — every value below is an empty placeholder.
#
# The operator must fill these in before applying the deployment. Never commit
# the filled-in file: keep it outside the repository (for example in a password
# manager, or create the Secrets directly with `kubectl create secret`, as
# described in README.md).
#
#   involute-auth     authToken, viewerAssertionSecret, adminEmailAllowlist
#   involute-db       postgresPassword
#   involute-redmine  apiKey
#   involute-dingtalk appKey, appSecret, redirectUri
#
# The Redmine API key, the database password and the DingTalk app credentials
# are the only values an operator must obtain elsewhere; the remaining values
# are secrets of this deployment.
apiVersion: v1
kind: Secret
metadata:
  name: involute-auth
  namespace: involute
  labels:
    app.kubernetes.io/name: involute-auth
    app.kubernetes.io/part-of: involute
type: Opaque
stringData:
  authToken: ""
  viewerAssertionSecret: ""
  adminEmailAllowlist: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: involute-db
  namespace: involute
  labels:
    app.kubernetes.io/name: involute-db
    app.kubernetes.io/part-of: involute
type: Opaque
stringData:
  postgresPassword: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: involute-redmine
  namespace: involute
  labels:
    app.kubernetes.io/name: involute-redmine
    app.kubernetes.io/part-of: involute
type: Opaque
stringData:
  apiKey: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: involute-dingtalk
  namespace: involute
  labels:
    app.kubernetes.io/name: involute-dingtalk
    app.kubernetes.io/part-of: involute
type: Opaque
stringData:
  # From the DingTalk console: the enterprise app behind this deployment.
  appKey: ""
  appSecret: ""
  # Must match the callback URL registered in the DingTalk console, and end
  # in /auth/dingtalk/callback — for example
  # https://involute.example.internal/auth/dingtalk/callback
  redirectUri: ""
